<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slot Machine Game</title>
  <link rel="stylesheet" href="../public/style.css" />
</head>
<body>
  <div class="container">
    <h1>🎰 Slot Machine Game</h1>

    <div class="balance-box">
      <label>Balance: <span id="balance">0</span></label>
    </div>

    <form id="game-form">
      <label>
        Deposit:
        <input type="number" id="deposit" required />
      </label>
      <label>
        Lines (1-3):
        <input type="number" id="lines" min="1" max="3" required />
      </label>
      <label>
        Bet/Line:
        <input type="number" id="bet" required />
      </label>
      <button type="submit">🎯 Spin!</button>
    </form>

    <div class="result">
      <h2>Result:</h2>
      <div id="slot-output"></div>
      <div id="winnings-output"></div>
    </div>
  </div>

  <script>
    let currentBalance = 0;

    document.getElementById('game-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const deposit = parseInt(document.getElementById('deposit').value);
      const lines = parseInt(document.getElementById('lines').value);
      const bet = parseInt(document.getElementById('bet').value);

      if (deposit > 0) currentBalance += deposit;

      const totalBet = lines * bet;
      if (totalBet > currentBalance) {
        alert('Not enough balance!');
        return;
      }

      const response = await fetch('/api/spin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ balance: currentBalance, bet, lines })
      });

      const data = await response.json();
      currentBalance = data.newBalance;

      document.getElementById('balance').textContent = currentBalance;
      document.getElementById('slot-output').innerHTML = formatRows(data.rows);
      document.getElementById('winnings-output').textContent = `🎉 You won: $${data.winnings}`;
    });

    function formatRows(rows) {
      return rows.map(row => `<div class="slot-row">${row.join(' | ')}</div>`).join('');
    }
  </script>
</body>
</html>
